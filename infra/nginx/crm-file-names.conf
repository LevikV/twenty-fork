# Имя файла при скачивании из CRM.
#
# Twenty отдаёт файл по ссылке с uuid и не передаёт настоящее имя (оно хранится
# только в подписи вложения в записи). Фронт добавляет к ссылке параметры:
#   filename=<имя в percent-encoding>  — как сохранять
#   disp=inline|attachment             — открыть в браузере или скачать
# nginx подменяет Content-Disposition. filename* — по RFC 5987, чтобы
# кириллица в имени не ломалась.

map $arg_disp $crm_file_disp {
    default  "attachment";
    "inline" "inline";
}

map $arg_filename $crm_file_cd {
    ""      "";
    default "$crm_file_disp; filename*=UTF-8''$arg_filename";
}
